version: 2.1

orbs:
  python: circleci/python@2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Create virtual environment and install packages
          command: |
            uv venv
            source .venv/bin/activate
            uv pip install -e my_inbox_api
      - run:
          name: Run tests
          command: |
            source .venv/bin/activate
            python -m unittest discover -s my_inbox_api/tests

workflows:
  main:
    jobs:
      - build-and-test