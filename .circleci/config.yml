version: 2.1
orbs:
  python: circleci/python@1.2
jobs:
  test:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            uv sync
      - run:
          name: List directory contents
          command: |
            ls -la
            ls -la my_inbox_api
      - run:
          name: Install my_inbox_api package
          command: |
            cd my_inbox_api
            # Use uv install instead of uv pip install
            uv install -e .
            # Install test dependencies in the same venv
            uv install ruff pytest pytest-cov coverage
      - run:
          name: Run Ruff Check on my_inbox_api
          command: |
            cd my_inbox_api
            uv run ruff check src/
      - run:
          name: Run Tests
          command: | 
            cd my_inbox_api
            mkdir -p ../test-results
            # Run tests from within the package directory
            uv run pytest tests/ --junitxml=../test-results/results.xml --cov=src
            uv run coverage xml -o ../coverage.xml
            uv run coverage report
            uv run coverage html -d ../htmlcov
      # Store test results to display in CircleCI UI
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
          
workflows:
  version: 2
  build_and_test:
    jobs:
      - test
