version: 2.1
orbs:
  python: circleci/python@2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install UV
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install dependencies and package
          command: |
            # Install test dependencies globally
            uv pip install --system pytest pytest-cov coverage ruff
            # Change to package directory and install it in development mode
            cd my_inbox_api
            uv pip install --system -e .
      - run:
          name: Run linting with Ruff
          command: |
            cd my_inbox_api
            ruff check src/
      - run:
          name: Run tests with coverage
          command: |
            cd my_inbox_api
            mkdir -p ../test-results/pytest
            python -m pytest tests --junitxml=../test-results/pytest/results.xml
            coverage run -m pytest tests
            coverage report -m
            coverage xml -o ../coverage.xml
      - store_artifacts:
          path: coverage.xml
          destination: coverage-report
      - store_test_results:
          path: test-results
workflows:
  main:
    jobs:
      - build-and-test
