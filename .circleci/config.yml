version: 2.1
orbs:
  python: circleci/python@1.2
jobs:
  test:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            uv sync
      - run:
          name: Install my_inbox_api package
          command: |
            cd my_inbox_api
            uv pip install -e .
      - run:
          name: Install test dependencies
          command: uv pip install ruff pytest pytest-cov coverage
      - run:
          name: Run Ruff Check on my_inbox_api
          command: uv run ruff check my_inbox_api/
      - run:
          name: Run Tests
          command: | 
            export PYTHONPATH="$PYTHONPATH:$PWD"
            mkdir -p test-results
            uv run pytest my_inbox_api/tests --junitxml=test-results/results.xml --cov=my_inbox_api
      - run:
          name: Generate coverage reports
          command: |
            uv run coverage xml
            uv run coverage report
            uv run coverage html
      # Store test results to display in CircleCI UI
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
          
workflows:
  version: 2
  build_and_test:
    jobs:
      - test
