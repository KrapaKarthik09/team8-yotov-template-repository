version: 2.1

orbs:
  python: circleci/python@2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install UV
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Create virtual environment and install packages
          command: |
            uv venv
            source .venv/bin/activate
            uv pip install -e my_inbox_api
            uv pip install coverage ruff pytest
      - run:
          name: Run linting with Ruff
          command: |
            source .venv/bin/activate
            uv run ruff check my_inbox_api/
      - run:
          name: Run tests with coverage
          command: |
            source .venv/bin/activate
            mkdir -p test-results/pytest
            uv run -- python -m pytest my_inbox_api/tests --junitxml=test-results/pytest/results.xml
            uv run -- coverage run -m pytest my_inbox_api/tests
            uv run -- coverage report -m
            uv run -- coverage xml
      - store_artifacts:
          path: coverage.xml
          destination: coverage-report
      - store_test_results:
          path: test-results

workflows:
  main:
    jobs:
      - build-and-test
