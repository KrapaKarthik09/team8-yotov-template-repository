[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team8-yotov-template"
version = "0.1.0"
description = "NYU OSS team project for inbox client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["my_inbox_api", "my_inbox_impl"]

[tool.uv.sources]
my_inbox_api = { workspace = true }
my_inbox_impl = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["my_inbox_api/tests", "my_inbox_impl/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"my_inbox_api/src/my_inbox_api/__init__.py" = ["E501"]
"my_inbox_api/tests/test_interface.py" = ["F401"]
